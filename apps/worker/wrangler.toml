name = "cafe-tycoon-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cafe-tycoon-db"
database_id = "4f2b6083-b6da-4046-8f8f-b54af8294047"

[[kv_namespaces]]
binding = "KV"
id = "aaf9dd750e7d4befbbad58bdee8b68d7"

[vars]
# Comma-separated list of allowed CORS origins.
ALLOWED_ORIGIN = "https://restaurant.huytehuy.id.vn,https://cafe-tycoon.pages.dev,http://localhost:5173"

# JWT_SECRET is set via `wrangler secret put JWT_SECRET` — do NOT commit it.

[env.dev]
[env.dev.vars]
ALLOWED_ORIGIN = "http://localhost:5173"
